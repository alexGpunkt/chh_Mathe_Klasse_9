<body>

<!-- Diese Seite wird an die Leinwand geworfen. Sie holt ihre Daten nicht
     selbst, sondern bekommt sie vom Lehrerdashboard über einen
     BroadcastChannel geschickt. Zwei Gründe: Das Sitzungstoken der
     Lehrkraft bleibt in genau einem Tab, und was hier steht, ist
     garantiert dasselbe, was die Lehrkraft auf ihrem Bildschirm sieht. -->

<header class="kopf">
  <div class="kopf-links">
    <h1 id="titel">Wo stehen wir gerade?</h1>
    <p class="unterzeile" id="unterzeile">warte auf das Lehrerdashboard …</p>
  </div>
  <div class="kopf-rechts">
    <div class="legende">
      <span class="legende-punkt gruen"></span>Ping da
      <span class="legende-punkt rot"></span>Ping fehlt
      <span class="legende-punkt alarm"></span>über dem Grenzwert
    </div>
    <div class="zaehler">
      <span id="zaehlerAktiv">0</span><small>mit Ping</small>
      <span id="zaehlerAlarm">0</span><small>im Alarm</small>
    </div>
    <button id="vollbild" type="button" aria-label="Vollbild ein- oder ausschalten" title="Vollbild ein- oder ausschalten (F)">⛶</button>
  </div>
</header>

<main id="bahnen" class="bahnen" aria-live="polite"></main>

<p id="hinweis" class="hinweis">
  Diese Ansicht wird vom Lehrerdashboard versorgt. Das Dashboard-Fenster
  muss geöffnet bleiben — es darf ruhig hinter diesem Fenster liegen.
</p>

<script src="beamer.js"></script>
</body>
</html>
